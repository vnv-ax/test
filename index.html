<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Мишка — остров ягод и рыбалки</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    position: fixed; inset: 0;
    background: #aee3f5;
    touch-action: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none; user-select: none;
    overscroll-behavior: none;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  }
  #c3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- HUD ---------- */
  .hud { position: absolute; z-index: 10; }
  #hudTop {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: 12px; right: 12px;
    display: flex; align-items: flex-start; gap: 8px;
    pointer-events: none;
  }
  .pill {
    display: flex; align-items: center; gap: 6px;
    background: rgba(255, 252, 242, 0.88);
    border-radius: 20px;
    padding: 7px 12px;
    font-size: 16px; font-weight: 700; color: #4a3b2a;
    box-shadow: 0 2px 6px rgba(70, 50, 20, 0.18);
    white-space: nowrap;
  }
  .pill svg { width: 18px; height: 18px; flex: 0 0 auto; }
  #satietyWrap { flex-direction: column; align-items: stretch; gap: 3px; padding: 7px 12px 8px; }
  #satietyBar { width: 96px; height: 8px; border-radius: 4px; background: #e8dcc0; overflow: hidden; }
  #satietyFill { height: 100%; width: 70%; border-radius: 4px; background: #f4a53c; transition: width .4s; }
  #satietyLabel { font-size: 11px; font-weight: 600; color: #7a6a50; line-height: 1; }
  #quest {
    margin-left: auto;
    max-width: 44vw;
    background: rgba(255, 252, 242, 0.88);
    border-radius: 18px; padding: 7px 12px;
    font-size: 13px; font-weight: 600; color: #4a3b2a;
    box-shadow: 0 2px 6px rgba(70, 50, 20, 0.18);
    line-height: 1.25;
  }
  #quest small { display: block; font-size: 10px; color: #b09058; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
  #btnSound {
    pointer-events: auto; align-self: flex-start;
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255, 252, 242, 0.88);
    box-shadow: 0 2px 6px rgba(70, 50, 20, 0.18);
    display: flex; align-items: center; justify-content: center;
    border: none; padding: 0;
  }
  #btnSound svg { width: 20px; height: 20px; }
  #btnSound.off svg .wave { display: none; }
  #btnSound.off svg .cross { display: block; }
  #btnSound svg .cross { display: none; }

  /* ---------- Toast + hint ---------- */
  #toast {
    left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 118px);
    transform: translateX(-50%) translateY(8px);
    background: rgba(58, 44, 28, 0.82);
    color: #fff8e8; font-size: 14px; font-weight: 600;
    border-radius: 16px; padding: 9px 16px;
    max-width: 78vw; text-align: center;
    opacity: 0; transition: opacity .3s, transform .3s;
    pointer-events: none; line-height: 1.3;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #hint {
    top: calc(env(safe-area-inset-top, 0px) + 58px);
    left: 50%; transform: translateX(-50%);
    background: rgba(255, 246, 214, 0.94);
    color: #6b5432; font-size: 13px; font-weight: 700;
    border-radius: 16px; padding: 8px 14px;
    max-width: 80vw; text-align: center;
    box-shadow: 0 2px 8px rgba(70, 50, 20, 0.15);
    opacity: 0; transition: opacity .35s; pointer-events: none; line-height: 1.3;
  }
  #hint.show { opacity: 1; }

  /* ---------- Joystick ---------- */
  #joyZone {
    left: 0; bottom: 0;
    width: 46%; height: 46%;
    pointer-events: auto;
  }
  #joyBase, #joyStick {
    position: absolute; border-radius: 50%;
    pointer-events: none; display: none;
  }
  #joyBase { width: 108px; height: 108px; background: rgba(255, 252, 242, 0.35); border: 2px solid rgba(255, 252, 242, 0.6); }
  #joyStick { width: 52px; height: 52px; background: rgba(255, 252, 242, 0.85); box-shadow: 0 2px 8px rgba(70,50,20,.25); }
  #joyHint {
    position: absolute; left: 40px; bottom: calc(env(safe-area-inset-bottom, 0px) + 36px);
    width: 92px; height: 92px; border-radius: 50%;
    border: 2px dashed rgba(255, 255, 255, 0.75);
    background: rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: rgba(255,255,255,.95);
    text-align: center; padding: 10px; line-height: 1.2;
    animation: joyPulse 2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes joyPulse { 0%,100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.06); opacity: 1; } }
  #joyHint.hidden { display: none; }

  /* ---------- Action button ---------- */
  #btnAct {
    right: calc(env(safe-area-inset-right, 0px) + 18px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 34px);
    width: 88px; height: 88px; border-radius: 50%;
    border: 3px solid #fff;
    background: radial-gradient(circle at 35% 30%, #ffc95e, #f29c2a);
    color: #5a3c10; font-size: 15px; font-weight: 800;
    box-shadow: 0 4px 14px rgba(70, 50, 20, 0.35);
    display: none; align-items: center; justify-content: center;
    text-align: center; line-height: 1.15; padding: 8px;
    pointer-events: auto;
    transition: transform .12s;
  }
  #btnAct:active { transform: scale(0.92); }
  #btnAct.show { display: flex; animation: actIn .18s ease-out; }
  @keyframes actIn { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #btnAct.bite {
    background: radial-gradient(circle at 35% 30%, #ff8a5e, #e8452a);
    color: #fff; animation: bitePulse .45s ease-in-out infinite;
  }
  @keyframes bitePulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.14); } }
  #btnAct .sub { display: block; font-size: 10px; font-weight: 700; opacity: .8; }

  /* ---------- Loading ---------- */
  #loader {
    position: absolute; inset: 0; z-index: 50;
    background: linear-gradient(180deg, #ffe9b8 0%, #aee3f5 62%, #7fd6f2 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity .5s;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  #loader h1 {
    font-size: 44px; color: #5a3c10; font-weight: 800; letter-spacing: .02em;
    text-shadow: 0 2px 0 rgba(255,255,255,.6);
  }
  #loader p.sub { margin-top: 6px; font-size: 15px; color: #7a6242; font-weight: 600; }
  #barWrap { margin-top: 26px; width: min(64vw, 300px); height: 12px; background: rgba(255,255,255,.55); border-radius: 8px; overflow: hidden; }
  #bar { height: 100%; width: 0%; background: linear-gradient(90deg, #f4a53c, #6fbf4a); border-radius: 8px; transition: width .3s; }
  #loadTip { margin-top: 14px; font-size: 13px; color: #7a6242; font-weight: 600; }
  #btnPlay {
    margin-top: 30px; display: none;
    border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ffc95e, #f29c2a);
    color: #5a3c10; font-size: 20px; font-weight: 800;
    padding: 14px 52px;
    box-shadow: 0 4px 0 #c77c18, 0 8px 18px rgba(70, 50, 20, 0.3);
  }
  #btnPlay.show { display: block; animation: actIn .3s ease-out; }
  #btnPlay:active { transform: translateY(3px); box-shadow: 0 1px 0 #c77c18; }
  #credits {
    position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    font-size: 10px; color: rgba(90, 60, 16, 0.75); text-align: center; padding: 0 20px;
  }
  #errBox {
    position: absolute; z-index: 60; inset: auto 12px 12px 12px;
    background: rgba(140, 30, 30, .92); color: #fff; font-size: 12px;
    border-radius: 10px; padding: 10px 12px; display: none; line-height: 1.4;
  }
</style>
</head>
<body>
<canvas id="c3d"></canvas>

<div id="hudTop" class="hud">
  <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-start;">
    <div style="display:flex; gap:8px;">
      <div class="pill" id="pillBerry">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="14" r="8" fill="#e8452a"/><circle cx="9.4" cy="11.6" r="2.2" fill="#ff9c8a" opacity=".85"/><path d="M12 6.5 C12 4.5 13.5 3 15.5 3 C15.5 5 14 6.5 12 6.5 Z" fill="#5aa53c"/><path d="M12 6.8 C10 6.2 8.5 6.6 7.5 7.6 C9 8.6 10.8 8.4 12 6.8 Z" fill="#4a8f30"/></svg>
        <span id="cntBerry">0</span>
      </div>
      <div class="pill" id="pillFish">
        <svg viewBox="0 0 24 24"><path d="M3 12 C6 7.5 11 6 15 8.5 C17 9.7 18.4 11 19.5 12 C18.4 13 17 14.3 15 15.5 C11 18 6 16.5 3 12 Z" fill="#f29c2a"/><path d="M19.5 12 L23 8.5 C22.3 11 22.3 13 23 15.5 Z" fill="#d97f14"/><circle cx="7.5" cy="11" r="1.1" fill="#4a3b2a"/></svg>
        <span id="cntFish">0</span>
      </div>
    </div>
    <div class="pill" id="satietyWrap">
      <div id="satietyLabel">Сытость</div>
      <div id="satietyBar"><div id="satietyFill"></div></div>
    </div>
  </div>
  <div id="quest"><small>Задание</small><span id="questText">…</span></div>
  <button id="btnSound" aria-label="Звук">
    <svg viewBox="0 0 24 24" fill="none" stroke="#6b5432" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 5 L6.5 9 H3 v6 h3.5 L11 19 Z" fill="#6b5432" stroke="none"/>
      <path class="wave" d="M15 9.5 a4 4 0 0 1 0 5"/>
      <path class="wave" d="M17.5 7 a8 8 0 0 1 0 10"/>
      <path class="cross" d="M15 9 l6 6 M21 9 l-6 6"/>
    </svg>
  </button>
</div>

<div id="hint" class="hud"></div>
<div id="toast" class="hud"></div>

<div id="joyZone" class="hud">
  <div id="joyBase"></div>
  <div id="joyStick"></div>
  <div id="joyHint">веди<br>мишку</div>
</div>

<button id="btnAct" class="hud"><span id="btnActText">Собрать</span></button>

<div id="loader">
  <h1>Мишка</h1>
  <p class="sub">остров ягод и рыбалки</p>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="loadTip">загрузка…</div>
  <button id="btnPlay">Играть</button>
  <div id="credits">Модель медведя: «Grizzly Bear» от freddy1231, Sketchfab, лицензия CC-BY 4.0</div>
</div>

<div id="errBox"></div>

<script src="js/lib/three.min.js"></script>
<script src="js/lib/GLTFLoader.js"></script>
<script src="js/lib/BufferGeometryUtils.js"></script>
<script src="js/game.js"></script>
</body>
</html>
